[tools]
"npm:@zed-industries/codex-acp" = "0.16.0"
"npm:zero-native" = "0.3.0"
"npm:@agentclientprotocol/claude-agent-acp" = "0.99.1"
"npm:portless" = "0.15.12"
"npm:pi-acp" = "0.0.34"
"npm:agent-browser" = "0.41.0"
"npm:@earendil-works/pi-coding-agent" = "1.4.0"
"npm:pnpm" = "12.16.1"
"npm:yarn" = "1.22.22"
aube = "2.8.5"
node = "26"
ruby = "4.0.9"

[tasks.thelm]
description = "Run the Thelm binary"
dir = "~/Documents/thelm"
run = "portless thelm just run"

[tasks.codex-sessions]
description = "Build and run the Codex Sessions dashboard"
dir = "~/Documents/codex-sessions"
run = "mise exec -- pnpm build && mise exec -- portless run --name codex-sessions pnpm start"
